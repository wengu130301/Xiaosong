<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI备忘录 - 我是晓松</title>
<link rel="stylesheet" href="css/common.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  .memo-editor {
    background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 24px; margin: 12px 16px; padding: 16px;
  }
  .memo-title-input {
    width: 100%; border: none; outline: none; background: transparent;
    font-size: 18px; font-weight: 600; color: var(--text-1);
    font-family: inherit; margin-bottom: 8px;
  }
  .memo-title-input::placeholder { color: var(--text-3); }
  .memo-content-input {
    width: 100%; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--text-1); font-family: inherit;
    line-height: 1.7; min-height: 200px; resize: none;
  }
  .memo-content-input::placeholder { color: var(--text-3); }

  .memo-toolbar {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; padding-top: 12px;
    border-top: 0.5px solid var(--separator);
  }
  .memo-tool-btn {
    display: flex; align-items: center; gap: 4px;
    background: var(--glass-bg-light); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 100px; padding: 8px 14px; font-size: 13px;
    font-weight: 500; color: var(--text-2); cursor: pointer;
    transition: all 0.15s;
  }
  .memo-tool-btn:active { transform: scale(0.95); }
  .memo-tool-btn svg { width: 16px; height: 16px; }
  .memo-tool-btn.ai {
    background: linear-gradient(135deg, #a18cd1, #fbc2eb);
    color: #fff; border-color: transparent;
  }
  .memo-tool-btn.save {
    background: var(--accent); color: #fff; border-color: transparent;
    margin-left: auto;
  }
  .memo-tool-btn.image {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border-color: transparent;
  }

  .memo-ai-loading {
    display: none; align-items: center; gap: 8px;
    padding: 12px; margin-top: 12px;
    background: var(--glass-bg-light); border-radius: 16px;
    font-size: 14px; color: var(--text-2);
  }
  .memo-ai-loading.show { display: flex; }
  .memo-ai-loading .spinner {
    width: 16px; height: 16px;
  }

  .memo-ai-suggestion {
    display: none; margin-top: 12px;
    background: linear-gradient(135deg, rgba(161,140,209,0.15), rgba(251,194,235,0.15));
    border: 1px solid rgba(161,140,209,0.3);
    border-radius: 16px; padding: 14px;
    font-size: 14px; color: var(--text-1); line-height: 1.7;
  }
  .memo-ai-suggestion.show { display: block; }
  .memo-ai-suggestion-header {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-2); margin-bottom: 8px;
    font-weight: 600;
  }
  .memo-ai-suggestion-actions {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .memo-ai-btn {
    padding: 6px 14px; border-radius: 100px; border: none;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .memo-ai-btn.accept { background: var(--accent); color: #fff; }
  .memo-ai-btn.dismiss { background: var(--glass-bg-light); color: var(--text-2); border: 1px solid rgba(255,255,255,0.4); }

  .memo-section-title {
    font-size: 14px; font-weight: 600; color: var(--text-2);
    margin: 20px 20px 10px;
  }
  .memo-list {
    padding: 0 16px;
  }
  .memo-item {
    background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 20px; padding: 14px 16px; margin-bottom: 10px;
    cursor: pointer; transition: transform 0.15s;
  }
  .memo-item:active { transform: scale(0.97); }
  .memo-item-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .memo-item-title {
    font-size: 16px; font-weight: 600; color: var(--text-1);
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .memo-item-time { font-size: 12px; color: var(--text-3); flex-shrink: 0; }
  .memo-item-content {
    font-size: 14px; color: var(--text-2); line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .memo-item-image {
    width: 100%; border-radius: 12px; margin-top: 8px;
  }
  .memo-empty {
    text-align: center; padding: 40px; color: var(--text-3); font-size: 14px;
  }

  .memo-image-preview {
    display: none; margin-top: 12px;
    border-radius: 16px; overflow: hidden;
  }
  .memo-image-preview.show { display: block; }
  .memo-image-preview img { width: 100%; border-radius: 16px; }
  .memo-image-preview-loading {
    display: none; flex-direction: column; align-items: center; gap: 8px;
    padding: 20px; margin-top: 12px;
    background: var(--glass-bg-light); border-radius: 16px;
  }
  .memo-image-preview-loading.show { display: flex; }
  .memo-image-preview-loading .spinner { width: 24px; height: 24px; }
  .memo-image-preview-loading span { font-size: 13px; color: var(--text-2); }
</style>
</head>
<body>
<div class="page">
  <!-- 顶部栏 -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <button class="header-back-btn" onclick="App.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
      </div>
      <div class="header-title">AI备忘录</div>
      <div class="header-right">
        <button class="header-icon-btn" onclick="newMemo()" title="新建">
          <svg viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2" style="width:22px;height:22px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 内容区 -->
  <div class="content">
    <div class="content-inner">
      <!-- 编辑区 -->
      <div class="memo-editor">
        <input type="text" class="memo-title-input" id="memoTitle" placeholder="标题">
        <textarea class="memo-content-input" id="memoContent" placeholder="写点什么... 支持AI补齐和AI生图"></textarea>

        <!-- AI生图预览 -->
        <div class="memo-image-preview" id="imagePreview">
          <img id="generatedImage" src="" alt="">
        </div>
        <div class="memo-image-preview-loading" id="imageLoading">
          <div class="spinner"></div>
          <span>AI正在生成图片...</span>
        </div>

        <!-- AI补齐建议 -->
        <div class="memo-ai-suggestion" id="aiSuggestion">
          <div class="memo-ai-suggestion-header">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
            晓松AI补齐建议
          </div>
          <div id="aiSuggestionText"></div>
          <div class="memo-ai-suggestion-actions">
            <button class="memo-ai-btn accept" onclick="acceptSuggestion()">采纳</button>
            <button class="memo-ai-btn dismiss" onclick="dismissSuggestion()">忽略</button>
          </div>
        </div>

        <!-- AI加载中 -->
        <div class="memo-ai-loading" id="aiLoading">
          <div class="spinner"></div>
          <span>晓松正在思考...</span>
        </div>

        <!-- 工具栏 -->
        <div class="memo-toolbar">
          <button class="memo-tool-btn ai" onclick="aiComplete()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            AI补齐
          </button>
          <button class="memo-tool-btn image" onclick="aiGenerateImage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            AI生图
          </button>
          <button class="memo-tool-btn save" onclick="saveMemo()">保存</button>
        </div>
      </div>

      <!-- 已保存的备忘录列表 -->
      <div class="memo-section-title">我的备忘录</div>
      <div class="memo-list" id="memoList"></div>

      <div style="height: 60px;"></div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
App.init('discover');

var editingId = null;

// 加载备忘录列表
function loadMemoList() {
  var memos = Storage.get('memos', []);
  var list = document.getElementById('memoList');

  if (memos.length === 0) {
    list.innerHTML = '<div class="memo-empty">还没有备忘录，写点什么吧</div>';
    return;
  }

  // 按时间倒序
  memos.sort(function(a, b) { return new Date(b.updatedAt) - new Date(a.updatedAt); });

  var html = '';
  memos.forEach(function(memo) {
    var imageHtml = memo.imageUrl ? '<img class="memo-item-image" src="' + memo.imageUrl + '">' : '';
    var contentPreview = memo.content || '(无内容)';
    html += '<div class="memo-item" onclick="editMemo(\'' + memo.id + '\')">' +
      '<div class="memo-item-header">' +
        '<div class="memo-item-title">' + Utils.escapeHtml(memo.title || '无标题') + '</div>' +
        '<div class="memo-item-time">' + Utils.timeAgo(memo.updatedAt) + '</div>' +
      '</div>' +
      '<div class="memo-item-content">' + Utils.escapeHtml(contentPreview) + '</div>' +
      imageHtml +
    '</div>';
  });
  list.innerHTML = html;
}

function newMemo() {
  editingId = null;
  document.getElementById('memoTitle').value = '';
  document.getElementById('memoContent').value = '';
  document.getElementById('imagePreview').classList.remove('show');
  document.getElementById('aiSuggestion').classList.remove('show');
  document.getElementById('memoTitle').focus();
}

function editMemo(id) {
  var memos = Storage.get('memos', []);
  var memo = memos.find(function(m) { return m.id === id; });
  if (!memo) return;

  editingId = id;
  document.getElementById('memoTitle').value = memo.title || '';
  document.getElementById('memoContent').value = memo.content || '';

  if (memo.imageUrl) {
    document.getElementById('generatedImage').src = memo.imageUrl;
    document.getElementById('imagePreview').classList.add('show');
  } else {
    document.getElementById('imagePreview').classList.remove('show');
  }

  document.getElementById('aiSuggestion').classList.remove('show');
}

function saveMemo() {
  var title = document.getElementById('memoTitle').value.trim();
  var content = document.getElementById('memoContent').value.trim();
  var imageEl = document.getElementById('generatedImage');
  var imageUrl = imageEl.src && imageEl.src.indexOf('data:') !== 0 ? imageEl.src : '';

  if (!title && !content) {
    return;
  }

  var memos = Storage.get('memos', []);
  var now = new Date().toISOString();

  if (editingId) {
    var idx = memos.findIndex(function(m) { return m.id === editingId; });
    if (idx >= 0) {
      memos[idx].title = title || '无标题';
      memos[idx].content = content;
      if (imageUrl) memos[idx].imageUrl = imageUrl;
      memos[idx].updatedAt = now;
    }
  } else {
    memos.push({
      id: Utils.generateId(),
      title: title || '无标题',
      content: content,
      imageUrl: imageUrl,
      createdAt: now,
      updatedAt: now,
    });
  }

  Storage.set('memos', memos);
  loadMemoList();
  newMemo();
}

function deleteMemo(id) {
  var memos = Storage.get('memos', []);
  memos = memos.filter(function(m) { return m.id !== id; });
  Storage.set('memos', memos);
  loadMemoList();
}

// AI补齐
async function aiComplete() {
  var content = document.getElementById('memoContent').value.trim();
  if (!content) {
    alert('请先写一些内容');
    return;
  }

  document.getElementById('aiLoading').classList.add('show');
  document.getElementById('aiSuggestion').classList.remove('show');

  try {
    var messages = [
      { role: 'system', content: '你是备忘录助手。用户正在写备忘录，请根据已有内容帮用户补齐和扩展。直接输出补齐后的完整内容，不要加解释。保持简洁。' },
      { role: 'user', content: '我的备忘录内容：\n' + content + '\n\n请帮我补齐和完善。' },
    ];

    var result = await ZhipuAPI.chat(messages, null, { temperature: 0.7 });

    document.getElementById('aiLoading').classList.remove('show');
    document.getElementById('aiSuggestionText').textContent = result;
    document.getElementById('aiSuggestion').classList.add('show');
  } catch (err) {
    document.getElementById('aiLoading').classList.remove('show');
    alert('AI补齐失败: ' + (err.message || '请稍后重试'));
  }
}

function acceptSuggestion() {
  var suggestion = document.getElementById('aiSuggestionText').textContent;
  document.getElementById('memoContent').value = suggestion;
  document.getElementById('aiSuggestion').classList.remove('show');
}

function dismissSuggestion() {
  document.getElementById('aiSuggestion').classList.remove('show');
}

// AI生图
async function aiGenerateImage() {
  var content = document.getElementById('memoContent').value.trim();
  var title = document.getElementById('memoTitle').value.trim();
  var prompt = content || title;

  if (!prompt) {
    alert('请先写一些内容或标题');
    return;
  }

  document.getElementById('imageLoading').classList.add('show');
  document.getElementById('imagePreview').classList.remove('show');

  try {
    var imageUrl = await ZhipuAPI.generateImage(prompt);
    document.getElementById('imageLoading').classList.remove('show');

    if (imageUrl) {
      document.getElementById('generatedImage').src = imageUrl;
      document.getElementById('imagePreview').classList.add('show');
    } else {
      alert('生图失败，请重试');
    }
  } catch (err) {
    document.getElementById('imageLoading').classList.remove('show');
    alert('AI生图失败: ' + (err.message || '请稍后重试'));
  }
}

// 初始化
loadMemoList();
</script>
</body>
</html>
