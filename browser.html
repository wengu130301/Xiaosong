<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>浏览器 - 我是晓松</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .browser-search-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 100px; padding: 10px 16px; margin: 8px 16px;
    box-shadow: var(--shadow-sm);
  }
  .browser-search-bar svg { width: 18px; height: 18px; color: var(--text-3); flex-shrink: 0; }
  .browser-search-bar input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--text-1); font-family: inherit;
  }
  .browser-search-bar input::placeholder { color: var(--text-3); }
  .browser-search-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 6px 16px; border-radius: 100px; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }

  .browser-nav-bar {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 4px 16px 8px;
  }
  .browser-nav-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--glass-bg-light); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; color: var(--text-2);
  }
  .browser-nav-btn:active { transform: scale(0.9); }
  .browser-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .browser-nav-btn svg { width: 18px; height: 18px; }
  .browser-nav-btn.home svg { color: var(--accent); }
  .browser-url {
    flex: 1; font-size: 13px; color: var(--text-3); text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 300px;
  }

  .browser-iframe-container {
    flex: 1; margin: 0 16px 16px;
    background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 20px; overflow: hidden;
    position: relative;
  }
  .browser-iframe {
    width: 100%; height: 100%; border: none;
    background: #fff;
  }

  /* 起始页 */
  .browser-home {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; padding: 40px 20px;
  }
  .browser-logo {
    width: 80px; height: 80px; border-radius: 20px;
    background: linear-gradient(135deg, #4481eb, #04befe);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px; box-shadow: var(--shadow-lg);
  }
  .browser-logo svg { width: 40px; height: 40px; color: #fff; }
  .browser-home-title {
    font-size: 20px; font-weight: 700; color: var(--text-1); margin-bottom: 4px;
  }
  .browser-home-desc {
    font-size: 14px; color: var(--text-3); margin-bottom: 32px;
  }

  .quick-links {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    width: 100%; max-width: 400px;
  }
  @media (min-width: 481px) {
    .quick-links { grid-template-columns: repeat(6, 1fr); }
  }
  .quick-link {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; transition: transform 0.15s;
    text-decoration: none;
  }
  .quick-link:active { transform: scale(0.9); }
  .quick-link-icon {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    box-shadow: var(--shadow-sm);
  }
  .quick-link-name {
    font-size: 12px; color: var(--text-2);
  }

  .browser-loading-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent); transform-origin: left;
    transform: scaleX(0); transition: transform 0.3s;
    z-index: 10;
  }
  .browser-loading-bar.loading {
    animation: loadingPulse 1.5s ease-in-out infinite;
  }
  @keyframes loadingPulse {
    0% { transform: scaleX(0); }
    50% { transform: scaleX(0.7); }
    100% { transform: scaleX(1); }
  }
</style>
</head>
<body>
<div class="page">
  <!-- 顶部栏 -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <button class="header-back-btn" onclick="App.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
      </div>
      <div class="header-title">浏览器</div>
      <div class="header-right"></div>
    </div>
  </header>

  <!-- 内容区 -->
  <div class="content">
    <div class="content-inner">
      <!-- 搜索栏 -->
      <div class="browser-search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="搜索或输入网址">
        <button class="browser-search-btn" onclick="doSearch()">搜索</button>
      </div>

      <!-- 导航栏 -->
      <div class="browser-nav-bar">
        <button class="browser-nav-btn" id="backBtn" onclick="goBack()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button class="browser-nav-btn" id="forwardBtn" onclick="goForward()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <div class="browser-url" id="urlDisplay">起始页</div>
        <button class="browser-nav-btn home" onclick="goHome()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <button class="browser-nav-btn" onclick="refresh()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-9-9 9 9 0 0 1 9-9c2.49 0 4.74 1.01 6.36 2.64L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>

      <!-- iframe 容器 -->
      <div class="browser-iframe-container" id="frameContainer">
        <div class="browser-loading-bar" id="loadingBar"></div>
        <!-- 起始页 -->
        <div class="browser-home" id="browserHome">
          <div class="browser-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </div>
          <div class="browser-home-title">我是晓松浏览器</div>
          <div class="browser-home-desc">搜索全网信息，快速直达</div>

          <div class="quick-links">
            <a href="javascript:void(0)" class="quick-link" onclick="navigateTo('https://www.baidu.com')">
              <div class="quick-link-icon" style="background: linear-gradient(135deg, #2196F3, #0D47A1);">B</div>
              <div class="quick-link-name">百度</div>
            </a>
            <a href="javascript:void(0)" class="quick-link" onclick="navigateTo('https://www.bilibili.com')">
              <div class="quick-link-icon" style="background: linear-gradient(135deg, #FB7299, #E45E8E);">B站</div>
              <div class="quick-link-name">哔哩</div>
            </a>
            <a href="javascript:void(0)" class="quick-link" onclick="navigateTo('https://www.zhihu.com')">
              <div class="quick-link-icon" style="background: linear-gradient(135deg, #0084FF, #005EC4);">知</div>
              <div class="quick-link-name">知乎</div>
            </a>
            <a href="javascript:void(0)" class="quick-link" onclick="navigateTo('https://m.weibo.cn')">
              <div class="quick-link-icon" style="background: linear-gradient(135deg, #FF6600, #CC4400);">微</div>
              <div class="quick-link-name">微博</div>
            </a>
            <a href="javascript:void(0)" class="quick-link" onclick="navigateTo('https://www.taobao.com')">
              <div class="quick-link-icon" style="background: linear-gradient(135deg, #FF6700, #CC4400);">淘</div>
              <div class="quick-link-name">淘宝</div>
            </a>
            <a href="javascript:void(0)" class="quick-link" onclick="navigateTo('https://m.douban.com')">
              <div class="quick-link-icon" style="background: linear-gradient(135deg, #007722, #004400);">豆</div>
              <div class="quick-link-name">豆瓣</div>
            </a>
            <a href="javascript:void(0)" class="quick-link" onclick="navigateTo('https://www.jd.com')">
              <div class="quick-link-icon" style="background: linear-gradient(135deg, #E1251B, #B00015);">JD</div>
              <div class="quick-link-name">京东</div>
            </a>
            <a href="javascript:void(0)" class="quick-link" onclick="navigateTo('https://www.toutiao.com')">
              <div class="quick-link-icon" style="background: linear-gradient(135deg, #FF5722, #CC3300);">头</div>
              <div class="quick-link-name">头条</div>
            </a>
          </div>
        </div>

        <!-- iframe -->
        <iframe class="browser-iframe" id="browserFrame" style="display:none;" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
App.init('discover');

var history_stack = [];
var history_index = -1;

function doSearch() {
  var query = document.getElementById('searchInput').value.trim();
  if (!query) return;

  // 判断是否是网址
  if (/^https?:\/\//.test(query)) {
    navigateTo(query);
  } else if (/^[\w-]+\.[\w-]+/.test(query)) {
    navigateTo('https://' + query);
  } else {
    // 百度搜索
    navigateTo('https://www.baidu.com/s?wd=' + encodeURIComponent(query));
  }
}

function navigateTo(url) {
  document.getElementById('browserHome').style.display = 'none';
  var frame = document.getElementById('browserFrame');
  frame.style.display = 'block';
  frame.src = url;

  // 更新地址栏
  document.getElementById('urlDisplay').textContent = url.replace(/^https?:\/\//, '').split('/')[0];

  // 更新历史
  history_stack = history_stack.slice(0, history_index + 1);
  history_stack.push(url);
  history_index = history_stack.length - 1;
  updateNavButtons();

  // 加载动画
  var loadingBar = document.getElementById('loadingBar');
  loadingBar.classList.add('loading');
  frame.onload = function() {
    loadingBar.classList.remove('loading');
  };
}

function goBack() {
  if (history_index > 0) {
    history_index--;
    var url = history_stack[history_index];
    document.getElementById('browserFrame').src = url;
    document.getElementById('urlDisplay').textContent = url.replace(/^https?:\/\//, '').split('/')[0];
    updateNavButtons();
  }
}

function goForward() {
  if (history_index < history_stack.length - 1) {
    history_index++;
    var url = history_stack[history_index];
    document.getElementById('browserFrame').src = url;
    document.getElementById('urlDisplay').textContent = url.replace(/^https?:\/\//, '').split('/')[0];
    updateNavButtons();
  }
}

function goHome() {
  document.getElementById('browserFrame').style.display = 'none';
  document.getElementById('browserFrame').src = '';
  document.getElementById('browserHome').style.display = 'flex';
  document.getElementById('urlDisplay').textContent = '起始页';
  document.getElementById('searchInput').value = '';
  updateNavButtons();
}

function refresh() {
  var frame = document.getElementById('browserFrame');
  if (frame.style.display !== 'none') {
    var src = frame.src;
    frame.src = '';
    frame.src = src;
  }
}

function updateNavButtons() {
  document.getElementById('backBtn').disabled = history_index <= 0;
  document.getElementById('forwardBtn').disabled = history_index >= history_stack.length - 1;
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
