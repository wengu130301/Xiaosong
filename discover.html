<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>发现 - 我是晓松</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .discover-search {
    display: flex; align-items: center; gap: 10px;
    background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border-radius: 20px; padding: 12px 16px; margin: 12px 16px;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .discover-search svg { width: 20px; height: 20px; color: var(--text-3); flex-shrink: 0; }
  .discover-search input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 16px; color: var(--text-1); font-family: inherit;
  }
  .discover-search input::placeholder { color: var(--text-3); }

  .section-title {
    font-size: 13px; font-weight: 600; color: var(--text-2);
    margin: 20px 20px 10px; letter-spacing: 0.5px;
  }

  .tool-grid-discover {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    padding: 0 16px;
  }
  .tool-card {
    background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 20px; padding: 20px 12px; text-align: center;
    cursor: pointer; transition: transform 0.15s; text-decoration: none;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .tool-card:active { transform: scale(0.94); }
  .tool-card-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #fff;
  }
  .tool-card-name { font-size: 14px; font-weight: 500; color: var(--text-1); }
  .tool-card-desc { font-size: 11px; color: var(--text-3); }

  .category-bar-discover {
    display: flex; gap: 8px; padding: 0 16px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; margin-bottom: 4px;
    scrollbar-width: none;
  }
  .category-bar-discover::-webkit-scrollbar { display: none; }
  .category-chip-discover {
    flex-shrink: 0; padding: 8px 16px; border-radius: 100px;
    font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,0.6);
    background: var(--glass-bg); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text-2); cursor: pointer; transition: all 0.2s;
    white-space: nowrap;
  }
  .category-chip-discover.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }

  .featured-card {
    margin: 0 16px 16px; border-radius: 24px; overflow: hidden;
    background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid rgba(255,255,255,0.6); cursor: pointer;
    transition: transform 0.15s;
  }
  .featured-card:active { transform: scale(0.97); }
  .featured-banner {
    width: 100%; height: 120px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; color: #fff; position: relative; overflow: hidden;
  }
  .featured-banner::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.2), transparent 60%);
  }
  .featured-body { padding: 16px; }
  .featured-title { font-size: 16px; font-weight: 600; color: var(--text-1); margin-bottom: 4px; }
  .featured-desc { font-size: 13px; color: var(--text-2); line-height: 1.5; }

  @media (min-width: 481px) {
    .tool-grid-discover { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 769px) {
    .tool-grid-discover { grid-template-columns: repeat(5, 1fr); }
  }
  @media (min-width: 1025px) {
    .tool-grid-discover { grid-template-columns: repeat(6, 1fr); }
  }
</style>
</head>
<body>
<div class="page">
  <!-- 顶部栏 -->
  <header class="header">
    <div class="header-inner">
      <h1 class="header-title">发现</h1>
    </div>
  </header>

  <!-- 内容区 -->
  <div class="content">
    <div class="content-inner">
      <!-- 搜索栏 -->
      <div class="discover-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="搜索工具或功能" id="searchInput">
      </div>

      <!-- 分类筛选 -->
      <div class="category-bar-discover" id="categoryBar">
        <div class="category-chip-discover active" data-cat="all">全部</div>
        <div class="category-chip-discover" data-cat="daily">日常生活</div>
        <div class="category-chip-discover" data-cat="work">效率工具</div>
        <div class="category-chip-discover" data-cat="ai">AI 智能</div>
      </div>

      <!-- 精选推荐 -->
      <div class="section-title">精选推荐</div>
      <div class="featured-card" onclick="location.href='weather.html'">
        <div class="featured-banner" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 15.3"/><path d="M12 12v9"/><path d="m9 18 3 3 3-3"/></svg>
        </div>
        <div class="featured-body">
          <div class="featured-title">语音天气播报</div>
          <div class="featured-desc">实时天气信息，语音播报让你解放双手，出行更安心</div>
        </div>
      </div>

      <!-- 全部工具 -->
      <div class="section-title">全部工具</div>
      <div class="tool-grid-discover" id="toolGrid">
        <!-- 天气 -->
        <a href="weather.html" class="tool-card" data-cat="daily" data-name="天气预报 语音播报">
          <div class="tool-card-icon" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 15.3"/></svg>
          </div>
          <div class="tool-card-name">天气预报</div>
          <div class="tool-card-desc">语音播报</div>
        </a>

        <!-- 地图 -->
        <a href="map.html" class="tool-card" data-cat="daily" data-name="地图 导航 高德地图 位置">
          <div class="tool-card-icon" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.06a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M7 3v18"/><path d="M17 3v18"/></svg>
          </div>
          <div class="tool-card-name">地图导航</div>
          <div class="tool-card-desc">高德地图</div>
        </a>

        <!-- 计算器 -->
        <a href="calculator.html" class="tool-card" data-cat="work" data-name="计算器 科学计算器 数学">
          <div class="tool-card-icon" style="background: linear-gradient(135deg, #fa709a, #fee140);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="8" x2="8" y1="14" y2="14"/><line x1="12" x2="12" y1="14" y2="14"/><line x1="16" x2="16" y1="14" y2="14"/><line x1="8" x2="8" y1="18" y2="18"/><line x1="12" x2="12" y1="18" y2="18"/><line x1="16" x2="16" y1="18" y2="18"/></svg>
          </div>
          <div class="tool-card-name">计算器</div>
          <div class="tool-card-desc">科学计算</div>
        </a>

        <!-- AI备忘录 -->
        <a href="memo.html" class="tool-card" data-cat="ai" data-name="备忘录 AI笔记 智能记录 生图">
          <div class="tool-card-icon" style="background: linear-gradient(135deg, #a18cd1, #fbc2eb);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" x2="15" y1="13" y2="13"/><line x1="9" x2="15" y1="17" y2="17"/></svg>
          </div>
          <div class="tool-card-name">AI备忘录</div>
          <div class="tool-card-desc">智能补齐</div>
        </a>

        <!-- 时钟 -->
        <a href="clock.html" class="tool-card" data-cat="daily" data-name="时钟 闹钟 秒表 计时器 世界时钟">
          <div class="tool-card-icon" style="background: linear-gradient(135deg, #ff6a00, #ee0979);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="tool-card-name">时钟</div>
          <div class="tool-card-desc">闹钟 秒表</div>
        </a>

        <!-- 浏览器 -->
        <a href="browser.html" class="tool-card" data-cat="work" data-name="浏览器 百度 搜索 网页">
          <div class="tool-card-icon" style="background: linear-gradient(135deg, #4481eb, #04befe);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </div>
          <div class="tool-card-name">浏览器</div>
          <div class="tool-card-desc">百度搜索</div>
        </a>
      </div>

      <div style="height: 100px;"></div>
    </div>
  </div>

  <!-- 底部 Tab -->
  <nav class="tab-bar" id="tabBar"></nav>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
  App.init('discover');

  // 分类筛选
  const chips = document.querySelectorAll('.category-chip-discover');
  const toolCards = document.querySelectorAll('#toolGrid .tool-card');

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      const cat = chip.dataset.cat;
      toolCards.forEach(card => {
        if (cat === 'all' || card.dataset.cat === cat) {
          card.style.display = '';
        } else {
          card.style.display = 'none';
        }
      });
    });
  });

  // 搜索
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    toolCards.forEach(card => {
      const name = (card.dataset.name || '').toLowerCase();
      if (!q || name.includes(q)) {
        card.style.display = '';
      } else {
        card.style.display = 'none';
      }
    });
  });
</script>
</body>
</html>
