staticSite:
  name: your-project-name
  buildCommand: npm install && npm run build
  publishDir: dist
  redirectRoutes:
    - source: /api/zhipu/:path*
      destination: https://open.bigmodel.cn/api/paas/:path*
      status: 200
    - source: /api/amap/:path*
      destination: https://restapi.amap.com/v3/:path*
      status: 200
  headers:
    - path: /*
      name: Cache-Control
      value: public, max-age=0, must-revalidate