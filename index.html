<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>我是晓松</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
/* 画图按钮 */
.input-image-btn {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  transition: all 0.2s ease;
  padding: 0;
}
.input-image-btn svg {
  width: 22px;
  height: 22px;
  transition: stroke 0.2s;
}
.input-image-btn:active {
  transform: scale(0.9);
}

/* 画图模式激活态 */
.input-bar.image-mode .input-image-btn svg {
  stroke: #AF52DE;
}
.input-bar.image-mode .input-inner {
  border-color: rgba(175, 82, 222, 0.3);
}

/* 画图模式指示条 */
.image-mode-bar {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 6px 20px;
  background: rgba(175, 82, 222, 0.08);
  border-bottom: 0.5px solid rgba(175, 82, 222, 0.15);
}
.image-mode-bar.active {
  display: flex;
}
.image-mode-tag {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #AF52DE;
}
.image-mode-exit {
  border: none;
  background: transparent;
  font-size: 13px;
  color: #86868B;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 999px;
  transition: background 0.2s;
}
.image-mode-exit:active {
  background: rgba(0, 0, 0, 0.06);
}

/* AI 生图卡片 */
.image-gen-card {
  width: 100%;
  margin-top: 6px;
  border-radius: 12px;
  overflow: hidden;
}

/* 加载状态 */
.image-gen-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 24px 16px;
  background: rgba(175, 82, 222, 0.06);
  border-radius: 12px;
}
.image-gen-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(175, 82, 222, 0.2);
  border-top-color: #AF52DE;
  border-radius: 50%;
  animation: image-gen-spin 0.8s linear infinite;
}
@keyframes image-gen-spin {
  to { transform: rotate(360deg); }
}
.image-gen-loading-text {
  font-size: 14px;
  color: #AF52DE;
  font-weight: 600;
}
.image-gen-prompt {
  font-size: 12px;
  color: #86868B;
  max-width: 240px;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 生成结果 */
.image-gen-result {
  border-radius: 12px;
  overflow: hidden;
}
.image-gen-img {
  width: 100%;
  display: block;
  border-radius: 12px;
}
.image-gen-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 4px 2px;
}
.image-gen-prompt-text {
  font-size: 12px;
  color: #86868B;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.image-gen-save-btn {
  flex-shrink: 0;
  padding: 6px 14px;
  border: 0.5px solid rgba(175, 82, 222, 0.3);
  border-radius: 999px;
  background: rgba(175, 82, 222, 0.08);
  font-size: 12px;
  color: #AF52DE;
  cursor: pointer;
  transition: all 0.15s ease;
}
.image-gen-save-btn:active {
  transform: scale(0.94);
  background: rgba(175, 82, 222, 0.15);
}

/* 错误状态 */
.image-gen-error {
  padding: 16px;
  text-align: center;
  font-size: 14px;
  color: #FF3B30;
  background: rgba(255, 59, 48, 0.06);
  border-radius: 12px;
}
</style>
</head>
<body>

<!-- 页面容器 -->
<div class="page" id="page">

  <!-- 顶部栏 - 磨砂玻璃全宽 -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <img class="header-avatar" src="assets/xiaosong-avatar.png" alt="晓松">
      </div>
      <div class="header-title" id="headerTitle">我是晓松</div>
      <div class="header-right">
        <button class="header-icon-btn" id="historyBtn" title="清空记录">
          <img src="assets/history-fill.png" alt="历史">
        </button>
      </div>
    </div>
  </header>

  <!-- 对话区域 -->
  <main class="content" id="chatContent">
    <div class="content-inner">
      <div class="chat-list" id="chatList">
        <!-- 消息动态插入 -->
      </div>
    </div>
  </main>

  <!-- 底部输入栏 - 磨砂玻璃全宽 -->
  <div class="input-bar" id="inputBar">
    <!-- 画图模式指示条 -->
    <div class="image-mode-bar" id="imageModeBar">
      <div class="image-mode-tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="#AF52DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        <span>AI 画图模式</span>
      </div>
      <button class="image-mode-exit" id="imageModeExit">退出</button>
    </div>
    <div class="input-inner">
      <button class="input-voice-btn" id="voiceBtn" title="语音输入">
        <img src="assets/voice-ai-line.png" alt="语音">
      </button>
      <button class="input-image-btn" id="imageBtn" title="AI画图">
        <svg viewBox="0 0 24 24" fill="none" stroke="#86868B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <div class="input-wrap">
        <textarea
          class="input-field"
          id="inputField"
          placeholder="发消息..."
          rows="1"
        ></textarea>
      </div>
      <button class="input-send-btn" id="sendBtn" disabled>
        <img src="assets/send-ins-line.png" alt="发送">
      </button>
    </div>
  </div>
</div>

<!-- 欢迎弹窗 -->
<div class="welcome-overlay" id="welcomeOverlay">
  <div class="welcome-card">
    <img class="welcome-avatar" src="assets/xiaosong-avatar.png" alt="晓松">
    <div class="welcome-text">
      <div class="welcome-hello">你好</div>
      <div class="welcome-name">我是晓松</div>
      <div class="welcome-desc">你的私人助理</div>
      <div class="welcome-greeting">很高兴认识你</div>
    </div>
    <button class="welcome-btn" id="welcomeBtn">开始使用</button>
  </div>
</div>

<!-- 语音录制浮层 -->
<div class="voice-overlay" id="voiceOverlay">
  <div class="voice-card">
    <div class="voice-pulse-wrap">
      <div class="voice-pulse"></div>
      <div class="voice-pulse voice-pulse-2"></div>
      <img class="voice-mic-icon" src="assets/voice-ai-line.png" alt="语音">
    </div>
    <div class="voice-status" id="voiceStatus">正在聆听...</div>
    <div class="voice-text" id="voiceText"></div>
    <button class="voice-cancel-btn" id="voiceCancelBtn">取消</button>
  </div>
</div>

<!-- 唯一入口脚本 -->
<script type="module" src="./main.js"></script>
</body>
</html>
