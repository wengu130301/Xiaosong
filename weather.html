<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>天气预报 - 我是晓松</title>
<link rel="stylesheet" href="css/common.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  .weather-main {
    padding: 20px 16px;
  }
  .weather-location {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-bottom: 20px;
  }
  .weather-location svg { width: 16px; height: 16px; color: var(--text-2); }
  .weather-location span { font-size: 15px; color: var(--text-2); font-weight: 500; }
  .weather-location input {
    border: none; outline: none; background: var(--glass-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 100px; padding: 8px 16px; font-size: 14px;
    width: 120px; text-align: center; color: var(--text-1);
  }

  .weather-current {
    background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 28px; padding: 32px 24px; text-align: center;
    margin-bottom: 16px;
  }
  .weather-temp {
    font-size: 72px; font-weight: 200; color: var(--text-primary);
    line-height: 1; margin-bottom: 8px;
  }
  .weather-temp sup { font-size: 28px; vertical-align: top; }
  .weather-condition {
    font-size: 18px; color: var(--text-2); font-weight: 500; margin-bottom: 4px;
  }
  .weather-range {
    font-size: 14px; color: var(--text-3);
  }
  .weather-icon-large {
    width: 80px; height: 80px; margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px;
  }
  .weather-detail-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-top: 20px;
  }
  .weather-detail-item {
    background: var(--glass-bg-light); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 16px; padding: 14px 8px; text-align: center;
  }
  .weather-detail-label { font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
  .weather-detail-value { font-size: 16px; font-weight: 600; color: var(--text-1); }

  .forecast-section {
    background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 24px; padding: 16px; margin-bottom: 16px;
  }
  .forecast-title {
    font-size: 14px; font-weight: 600; color: var(--text-2);
    margin-bottom: 12px; padding-left: 4px;
  }
  .forecast-list { display: flex; flex-direction: column; gap: 0; }
  .forecast-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px; border-bottom: 0.5px solid var(--separator);
  }
  .forecast-row:last-child { border-bottom: none; }
  .forecast-day { font-size: 15px; font-weight: 500; color: var(--text-1); width: 80px; }
  .forecast-weather { display: flex; align-items: center; gap: 8px; flex: 1; }
  .forecast-weather-icon { font-size: 20px; }
  .forecast-weather-text { font-size: 14px; color: var(--text-2); }
  .forecast-temp-range { font-size: 15px; font-weight: 500; color: var(--text-1); }

  .weather-broadcast-bar {
    position: sticky; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--glass-bg-heavy); backdrop-filter: blur(var(--glass-blur-heavy));
    -webkit-backdrop-filter: blur(var(--glass-blur-heavy));
    border-top: 1px solid rgba(255,255,255,0.5);
    padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .broadcast-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--accent-gradient); color: #fff; border: none;
    padding: 12px 28px; border-radius: 100px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s;
  }
  .broadcast-btn:active { transform: scale(0.95); }
  .broadcast-btn svg { width: 20px; height: 20px; }
  .broadcast-btn.playing { background: linear-gradient(135deg, #FF3B30, #FF453A); }

  .weather-loading {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 40px; color: var(--text-3); font-size: 14px;
  }
  .weather-error {
    text-align: center; padding: 40px; color: var(--text-3); font-size: 14px;
  }

  .hourly-scroll {
    display: flex; gap: 12px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; padding: 4px;
    scrollbar-width: none;
  }
  .hourly-scroll::-webkit-scrollbar { display: none; }
  .hourly-item {
    flex-shrink: 0; text-align: center; min-width: 56px;
    background: var(--glass-bg-light); border: 1px solid rgba(255,255,255,0.4);
    border-radius: 16px; padding: 10px 6px;
  }
  .hourly-time { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
  .hourly-icon { font-size: 20px; margin-bottom: 4px; }
  .hourly-temp { font-size: 14px; font-weight: 600; color: var(--text-1); }
</style>
</head>
<body>
<div class="page">
  <!-- 顶部栏 -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <button class="header-back-btn" onclick="App.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
      </div>
      <div class="header-title">天气预报</div>
      <div class="header-right"></div>
    </div>
  </header>

  <!-- 内容区 -->
  <div class="content">
    <div class="content-inner">
      <!-- 城市搜索 -->
      <div class="weather-location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <input type="text" id="cityInput" placeholder="输入城市名" value="北京">
      </div>

      <!-- 加载中 -->
      <div class="weather-loading" id="loadingView" style="display:none;">
        <div class="spinner"></div>
        <span>正在获取天气...</span>
      </div>

      <!-- 错误 -->
      <div class="weather-error" id="errorView" style="display:none;">
        <p id="errorText">获取天气失败</p>
        <p style="margin-top:8px;font-size:13px;">请检查城市名后重试</p>
      </div>

      <!-- 天气内容 -->
      <div id="weatherContent" style="display:none;">
        <!-- 当前天气 -->
        <div class="weather-current">
          <div class="weather-icon-large" id="currentIcon"></div>
          <div class="weather-temp" id="currentTemp">--<sup>&deg;C</sup></div>
          <div class="weather-condition" id="currentCondition">--</div>
          <div class="weather-range" id="currentRange">-- ~ --</div>
          <div class="weather-detail-grid">
            <div class="weather-detail-item">
              <div class="weather-detail-label">湿度</div>
              <div class="weather-detail-value" id="humidity">--</div>
            </div>
            <div class="weather-detail-item">
              <div class="weather-detail-label">风向风力</div>
              <div class="weather-detail-value" id="wind">--</div>
            </div>
            <div class="weather-detail-item">
              <div class="weather-detail-label">空气质量</div>
              <div class="weather-detail-value" id="aqi">--</div>
            </div>
          </div>
        </div>

        <!-- 24小时预报 -->
        <div class="forecast-section">
          <div class="forecast-title">逐时预报</div>
          <div class="hourly-scroll" id="hourlyList"></div>
        </div>

        <!-- 未来几天预报 -->
        <div class="forecast-section">
          <div class="forecast-title">未来天气预报</div>
          <div class="forecast-list" id="forecastList"></div>
        </div>
      </div>

      <div style="height: 80px;"></div>
    </div>
  </div>

  <!-- 语音播报按钮 -->
  <div class="weather-broadcast-bar">
    <button class="broadcast-btn" id="broadcastBtn" onclick="toggleBroadcast()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      <span id="broadcastText">语音播报</span>
    </button>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
App.init('discover');

// 天气图标映射
const WEATHER_ICONS = {
  '晴': '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FF9500" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
  '多云': '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5"><path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 15.3"/></svg>',
  '阴': '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5"><path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 15.3"/></svg>',
  '小雨': '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#4facfe" stroke-width="1.5"><path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 15.3"/><path d="M8 19v2M12 19v2M16 19v2"/></svg>',
  '中雨': '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="1.5"><path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 15.3"/><path d="M8 19v3M12 19v3M16 19v3"/></svg>',
  '大雨': '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#004EDD" stroke-width="1.5"><path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 15.3"/><path d="M6 19v3M10 19v3M14 19v3M18 19v3"/></svg>',
  '雪': '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#5AC8FA" stroke-width="1.5"><path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 15.3"/><path d="M8 19l0 2M12 19l0 2M16 19l0 2"/><circle cx="8" cy="22" r="0.5" fill="#5AC8FA"/><circle cx="12" cy="22" r="0.5" fill="#5AC8FA"/><circle cx="16" cy="22" r="0.5" fill="#5AC8FA"/></svg>',
  '雾': '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="1.5"><path d="M3 8h18M3 12h18M3 16h18"/></svg>',
};

function getWeatherIcon(text) {
  for (var key in WEATHER_ICONS) {
    if (text.indexOf(key) >= 0) return WEATHER_ICONS[key];
  }
  return WEATHER_ICONS['多云'];
}

var currentWeatherData = null;

async function loadWeather(city) {
  document.getElementById('loadingView').style.display = 'flex';
  document.getElementById('errorView').style.display = 'none';
  document.getElementById('weatherContent').style.display = 'none';

  try {
    // 获取实况天气
    var baseData = await AmapAPI.getWeather(city, 'base');
    var live = baseData.lives && baseData.lives[0];

    // 获取天气预报
    var forecastData = await AmapAPI.getWeather(city, 'all');
    var forecasts = forecastData.forecasts && forecastData.forecasts[0];

    currentWeatherData = { live: live, forecasts: forecasts, city: city };

    document.getElementById('loadingView').style.display = 'none';
    document.getElementById('weatherContent').style.display = 'block';

    // 渲染当前天气
    if (live) {
      document.getElementById('currentIcon').innerHTML = getWeatherIcon(live.weather);
      document.getElementById('currentTemp').innerHTML = live.temperature + '<sup>&deg;C</sup>';
      document.getElementById('currentCondition').textContent = live.weather;
      document.getElementById('currentRange').textContent = live.reporttime;
      document.getElementById('humidity').textContent = live.humidity + '%';
      document.getElementById('wind').textContent = live.winddirection + '风 ' + live.windpower + '级';
      document.getElementById('aqi').textContent = '--';
    }

    // 渲染逐时预报
    if (forecasts && forecasts.casts) {
      var hourlyHtml = '';
      var now = new Date();
      var currentHour = now.getHours();
      forecasts.casts.forEach(function(cast, i) {
        var hour = (currentHour + i) % 24;
        hourlyHtml += '<div class="hourly-item">' +
          '<div class="hourly-time">' + (i === 0 ? '现在' : hour + ':00') + '</div>' +
          '<div class="hourly-icon">' + getWeatherIcon(cast.dayweather) + '</div>' +
          '<div class="hourly-temp">' + cast.daytemp + '&deg;</div>' +
        '</div>';
      });
      document.getElementById('hourlyList').innerHTML = hourlyHtml;

      // 渲染未来几天
      var fcHtml = '';
      forecasts.casts.forEach(function(cast, i) {
        var dayLabel = i === 0 ? '今天' : i === 1 ? '明天' : i === 2 ? '后天' : Utils.formatDate(cast.date).slice(5);
        fcHtml += '<div class="forecast-row">' +
          '<div class="forecast-day">' + dayLabel + '</div>' +
          '<div class="forecast-weather">' +
            '<span class="forecast-weather-icon">' + getWeatherIcon(cast.dayweather) + '</span>' +
            '<span class="forecast-weather-text">' + cast.dayweather + ' 转 ' + cast.nightweather + '</span>' +
          '</div>' +
          '<div class="forecast-temp-range">' + cast.daytemp + '&deg; / ' + cast.nighttemp + '&deg;</div>' +
        '</div>';
      });
      document.getElementById('forecastList').innerHTML = fcHtml;
    }
  } catch (err) {
    document.getElementById('loadingView').style.display = 'none';
    document.getElementById('errorView').style.display = 'block';
    document.getElementById('errorText').textContent = '获取天气失败: ' + (err.message || '未知错误');
  }
}

function toggleBroadcast() {
  var btn = document.getElementById('broadcastBtn');
  var text = document.getElementById('broadcastText');

  if (Speaker.isSpeaking()) {
    Speaker.stop();
    btn.classList.remove('playing');
    text.textContent = '语音播报';
    return;
  }

  if (!currentWeatherData || !currentWeatherData.live) return;

  var live = currentWeatherData.live;
  var reportText = '当前' + currentWeatherData.city + '天气' + live.weather +
    '，气温' + live.temperature + '度，' +
    live.winddirection + '风' + live.windpower + '级，' +
    '湿度' + live.humidity + '%。';

  // 添加预报
  if (currentWeatherData.forecasts && currentWeatherData.forecasts.casts) {
    var casts = currentWeatherData.forecasts.casts;
    if (casts.length > 1) {
      var tomorrow = casts[1];
      reportText += '明天' + tomorrow.dayweather + '转' + tomorrow.nightweather +
        '，' + tomorrow.daytemp + '到' + tomorrow.nighttemp + '度。';
    }
  }

  btn.classList.add('playing');
  text.textContent = '停止播报';

  Speaker.speak(reportText, function() {
    btn.classList.remove('playing');
    text.textContent = '语音播报';
  });
}

// 搜索
document.getElementById('cityInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var city = this.value.trim();
    if (city) loadWeather(city);
  }
});

// 默认加载北京
loadWeather('北京');
</script>
</body>
</html>
